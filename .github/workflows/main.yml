name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  versions:
    name: Lucee ${{ matrix.lucee }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lucee: 5.4/stable/jar, java: 11 }
          - { lucee: 6.2/stable/jar, java: 21 }
          - { lucee: 6.2/snapshot/jar, java: 21 }
          - { lucee: 7.0/stable/jar, java: 21 }
          - { lucee: 7.0/snapshot/jar, java: 21 }
          - { lucee: 7.1/snapshot/jar, java: 21 }
          - { lucee: 8.0/snapshot/jar, java: 21 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: lucee-script-runner-maven-cache

      # jar names include the full version, so a new snapshot is a new key, saved once
      - name: Resolve Lucee jar
        id: lucee
        run: echo "jar=$(curl -sf https://update.lucee.org/rest/update/provider/latest/${{ matrix.lucee }}/filename | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Cache Lucee jar ${{ steps.lucee.outputs.jar }}
        uses: actions/cache@v6
        with:
          path: lucee-download-cache/${{ steps.lucee.outputs.jar }}
          key: lucee-jar-${{ steps.lucee.outputs.jar }}

      - name: Run debug.cfm, passing variables
        run: ant -DluceeVersionQuery="${{ matrix.lucee }}" -Dexecute="/debug.cfm" -Dtruth="cfml rocks" -Dauthor="Zac Spitzer"

      - name: Compile webroot
        run: ant -DluceeVersionQuery="${{ matrix.lucee }}" -Dexecute="/index.cfm" -Dcompile="true"

      - name: Compile webroot with errors, expect the run to fail before executing
        run: |
          if ant -DluceeVersionQuery="${{ matrix.lucee }}" -Dexecute="/index.cfm" -Dcompile="true" \
              -Dwebroot="${{ github.workspace }}/tests/compile-mixed" > compile-mixed.txt 2>&1; then
            cat compile-mixed.txt
            echo "::error::compile errors didn't fail the run"
            exit 1
          fi
          cat compile-mixed.txt
          grep -q "badpage.cfm" compile-mixed.txt || { echo "::error::badpage.cfm compile error not reported"; exit 1; }
          grep -q "BadComponent.cfc" compile-mixed.txt || { echo "::error::BadComponent.cfc compile error not reported"; exit 1; }
          if grep -q "compile-mixed index.cfm ran" compile-mixed.txt; then
            echo "::error::index.cfm ran despite compile errors"
            exit 1
          fi

      # Lucee writes its config back to the file it's given, so pass a copy
      - name: LUCEE_BASE_CONFIG env var is applied
        if: ${{ !startsWith( matrix.lucee, '5.' ) }}
        run: |
          cp tests/base-config/.CFConfig.json "$RUNNER_TEMP/base-config.json"
          LUCEE_BASE_CONFIG="$RUNNER_TEMP/base-config.json" \
            ant -DluceeVersionQuery="${{ matrix.lucee }}" -Dexecute="/index.cfm" -Dwebroot="${{ github.workspace }}/tests/base-config"

  variants:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: lucee-script-runner-maven-cache

      # pinned versions only, so a fixed key is fine
      - name: Cache Lucee files
        uses: actions/cache@v6
        with:
          path: lucee-download-cache/
          key: lucee-downloads-variants

      - name: Run default
        run: ant

      - name: Run Lucee 6 Stable
        run: ant -DluceeVersion="6.2.2.91" -Dexecute="/debug.cfm"

      - name: Run Lucee 5 (using Lucee light, no extensions)
        run: ant -DluceeVersion="light-5.4.2.17" -Dexecute="/debug.cfm"

      - name: Run Lucee 6 (using Lucee zero, no extensions, no admin, no docs)
        run: ant -DluceeVersion="zero-6.2.2.91" -Dexecute="/debug.cfm"

      - name: Run Latest Lucee 5 RC Light
        run: ant -DluceeVersionQuery="5/rc/light" -Dexecute="/debug.cfm"

      - name: Test concurrent execution with unique working directories
        run: |
          ant -DuniqueWorkingDir="true" -Dexecute="/debug.cfm" &
          ant -DuniqueWorkingDir="true" -Dexecute="/debug.cfm" &
          wait
